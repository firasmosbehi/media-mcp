[package]
name = "media-mcp"
version = "0.1.0"
edition = "2024"
description = "MCP server for editing and generating photos and videos via ffmpeg and libvips"
license = "MIT"
repository = "https://github.com/firasmosbehi/media-mcp"

[dependencies]
rmcp = { version = "3.10", features = ["server", "macros", "transport-io"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "sync", "time", "fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
